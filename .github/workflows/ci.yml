name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        shell: pwsh
        run: python -m compileall App tests tools

      - name: Run Evoca structured tests without private PDFs
        shell: pwsh
        run: |
          python -m pytest `
            tests/test_evoca_structured_extractor.py `
            tests/test_evoca_structured_adapter.py `
            tests/test_evoca_structured_path_dispatch.py `
            tests/test_evoca_end_to_end.py `
            -q

  evoca-real-pdf-e2e:
    name: Evoca real-PDF e2e
    if: ${{ vars.EVOCA_E2E_ENABLED == '1' }}
    runs-on:
      - self-hosted
      - Windows
      - evoca-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run gated Evoca real-PDF e2e
        shell: pwsh
        env:
          EVOCA_E2E_PDF_DIR: ${{ vars.EVOCA_E2E_PDF_DIR }}
        run: powershell -ExecutionPolicy Bypass -File tools\run_evoca_real_pdf_e2e.ps1 -PdfDir "$env:EVOCA_E2E_PDF_DIR"
